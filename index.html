<script>
/* MULTIPLAYER CONFIG: set WS_URL to your deployed WebSocket server URL (wss://...) */
const WS_URL = "wss://YOUR-WEBSOCKET-SERVER.example";
const MP = { ws:null, id:null, peers:new Map(), lastSend:0, state:"Belum dikonfigurasi" };
const netState=document.getElementById('netstate'), netDot=document.getElementById('netdot'), netCount=document.getElementById('netcount');
function netUi(state,ok=false){netState.textContent=state;netDot.style.background=ok?'#58e070':'#e44';netCount.textContent='Pemain: '+(MP.peers.size+1)}
function mpConnect(){
 if(!WS_URL || WS_URL.includes('YOUR-WEBSOCKET-SERVER')) { netUi('SERVER BELUM DIATUR'); return; }
 try{
  const ws=new WebSocket(WS_URL); MP.ws=ws;
  ws.onopen=()=>{netUi('TERHUBUNG',true);ws.send(JSON.stringify({type:'join',name:'Player'}))};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
   if(m.type==='welcome'){MP.id=m.id; if(m.players) for(const p of m.players) if(p.id!==MP.id)MP.peers.set(p.id,p);netUi('TERHUBUNG',true)}
   else if(m.type==='state' && m.player && m.player.id!==MP.id){MP.peers.set(m.player.id,{...MP.peers.get(m.player.id),...m.player,seen:Date.now()});netUi('TERHUBUNG',true)}
   else if(m.type==='leave'){MP.peers.delete(m.id);netUi('TERHUBUNG',true)}
   else if(m.type==='shot' && m.id!==MP.id){const p=MP.peers.get(m.id);if(p){p.flash=1;p.shot={x:m.x,y:m.y,vx:m.vx,vy:m.vy,l:1}}}
  };
  ws.onclose=()=>{netUi('KONEKSI TERPUTUS');setTimeout(mpConnect,3000)};
  ws.onerror=()=>netUi('GAGAL KONEKSI');
 }catch(e){netUi('GAGAL KONEKSI')}
}
function mpSend(obj){if(MP.ws&&MP.ws.readyState===1)MP.ws.send(JSON.stringify(obj))}
setInterval(()=>{if(!MP.id)return;mpSend({type:'state',player:{x:b.x,z:b.z,dir:b.dir,t:b.t,ph:b.ph,rot:b.rot,rl:b.rl,ammo:ammo}});for(const [id,p] of MP.peers)if(Date.now()-(p.seen||0)>8000)MP.peers.delete(id);netUi(MP.ws&&MP.ws.readyState===1?'TERHUBUNG':'MENYAMBUNG',!!(MP.ws&&MP.ws.readyState===1))},50);
mpConnect();
</script>
<script>

// ---- landscape + layar penuh otomatis

// ---- aset

function start(){Bw=IM.Body1.width*K;BHt=IM.Body1.height*K;FHt=IM.Foot1.height*K;HU=IM.Head1.height*K*.18;GW=GWD;GH=GWD*IM.AK.height/IM.AK.width;MS=GW/IM.AK.width;{const mw0=IM.Mag.width*MS,mh0=IM.Mag.height*MS;MW=mw0*MK;MH=mh0*MK;MAGC[1]=(MAGC[1]*GH-mh0/2+MH/2)/GH;MAGH[1]=MAGC[1]+.02}FXn=[-34*K,34*K];
 camX=-VW/2;camY=-SY;requestAnimationFrame(loop)}

function stopSfx(){try{SFX.pause();SFX.currentTime=0;if(SS){SS.stop();SS=null}}catch(e){}}
function playSfx(){try{if(AC&&SB&&AC.state=='running'){SS=AC.createBufferSource();SS.buffer=SB;SS.connect(AC.destination);SS.start()}else{SFX.currentTime=0;SFX.play().catch(()=>{})}}catch(e){}}

// interpolasi Catmull-Rom (halus, tanpa berhenti-jalan) lewat keyframe [waktu,[nilai...]]
function hm(K,t){const n=K.length;if(t<=K[0][0])return K[0][1].slice();if(t>=K[n-1][0])return K[n-1][1].slice();let i=0;while(K[i+1][0]<t)i++;
 const A=K[Math.max(i-1,0)],B=K[i],C=K[i+1],D=K[Math.min(i+2,n-1)],h=C[0]-B[0],u=(t-B[0])/h,u2=u*u,u3=u2*u;

 const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(170,t0);o.frequency.exponentialRampToValueAtTime(45,t0+.1);og.gain.setValueAtTime(.5,t0);og.gain.exponentialRampToValueAtTime(.001,t0+.13);o.connect(og);og.connect(AC.destination);o.start(t0);o.stop(t0+.14)}catch(e){}}
function shoot(d){cd=.085;ammo--;updAmmo();
 const m=Gp(...MUZ),dx=d*Math.cos(gun.r),dy=d*Math.sin(gun.r),a=(Math.random()-.5)*.03,c=Math.cos(a),sn=Math.sin(a);
 bullets.push({x:m[0],y:m[1],vx:(dx*c-dy*sn)*40,vy:(dx*sn+dy*c)*40,l:1});
 mpSend({type:'shot',x:m[0],y:m[1],vx:(dx*c-dy*sn)*40,vy:(dx*sn+dy*c)*40});
 b.flash=1;shk=2.4;b.kick=1;
 gA.vx-=dx*3.4;gA.vy-=dy*3.4+.8;gA.vr-=d*.05*(.6+Math.random()*.8);
 const e=Gp(...EJP);shells.push({x:e[0],y:e[1],vx:-d*(.8+Math.random()*1.2),vy:-(3.2+Math.random()*2),r:0,vr:(Math.random()-.5)*.6,l:1,gy:b.z+Math.random()*4});
 bang()}
function step(f){
 const l1=r=>1-pw(r,f);
 b.vx+=(mx*4.6-b.vx)*l1(.72);b.vz+=(my*3.4-b.vz)*l1(.72);b.x+=b.vx*f;b.z+=b.vz*f;
 const s=Math.hypot(b.vx,b.vz),sc=Math.min(1,s/4),sh=Math.max(s,1);
 const aa=Math.hypot(ax,ay)>.25;if(aa){if(Math.abs(ax)>.2)b.dir=ax>0?1:-1}else if(Math.abs(b.vx)>.3)b.dir=b.vx>0?1:-1;const d=b.dir;b.t+=(d-b.t)*l1(.8);
 b.ph+=s*.07*f;b.br+=.045*f;b.tilt+=(b.vx*.022-b.tilt)*l1(.75);

 for(const q of dust){q.x+=q.vx*f;q.y+=q.vy*f;q.l-=.035*f}while(dust.length&&dust[0].l<=0)dust.shift();
 for(const q of drops){q.vy+=.5*f;q.x+=q.vx*f;q.y+=q.vy*f;q.r+=q.vr*f;if(q.y>q.gy){q.y=q.gy;q.vy=Math.abs(q.vy)>1.5?-q.vy*.3:0;q.vx*=.6;q.vr*=.5}q.l-=.004*f}while(drops.length&&drops[0].l<=0)drops.shift();
 for(const q of bullets){q.x+=q.vx*f;q.y+=q.vy*f;q.a=(q.a||0)+f;q.l-=.025*f}while(bullets.length&&bullets[0].l<=0)bullets.shift();
 for(const q of shells){q.vy+=.45*f;q.x+=q.vx*f;q.y+=q.vy*f;q.r+=q.vr*f;if(q.y>q.gy){q.y=q.gy;q.vy=Math.abs(q.vy)>1.2?-q.vy*.35:0;q.vx*=.55;q.vr*=.4}q.l-=.006*f}while(shells.length&&shells[0].l<=0)shells.shift();
 // ---- waktu reload (detik, sinkron dengan suara)

  const mh=Gp(...MAGH),hg=Gp(...HGUARD),c1=Gp(...CHF),c0=Gp(...CHB);
  const pbk=Bp(d*22,-BHt*.3),pm=Bp(d*72,-BHt*.33),pe=Bp(d*106,-BHt*.37),cf=[c1[0]+d*8,c1[1]-4];
  const K2=[[0,hg],[.22,[mh[0]-d*2,mh[1]+30]],[.3,mh],[.38,[mh[0]+d*8,mh[1]+16]],[.44,[mh[0]+d*16,mh[1]+30]],[.5,[lp(mh[0]+d*16,pbk[0],.5),lp(mh[1]+30,pbk[1],.5)]],[.56,pbk],[.62,pbk],[.69,pm],[.74,pe],[.82,[mh[0]+d*3,mh[1]+14]],[.9,[mh[0]+d*3,mh[1]+2]],[1.0,[mh[0]-d,mh[1]+4]],[1.1,mh],[1.2,[mh[0]+d*6,mh[1]+20]],[1.3,cf],[1.4,c1],[1.5,c1],[1.62,c0],[1.72,c0],[1.8,c1],[1.9,[lp(c1[0],hg[0],.5),lp(c1[1],hg[1],.5)]],[2.05,[hg[0],hg[1]+6]],[2.2,hg],[RT,hg]];

let last=performance.now();

// ---- joystick 2D + tombol + keyboard
function stick(joy,kn,set){let id=null;
 const mv=e=>{const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+62),dy=e.clientY-(r.top+62),d=Math.hypot(dx,dy),m=Math.min(d,45),a=Math.atan2(dy,dx);
  kn.style.left=37+Math.cos(a)*m+'px';kn.style.top=37+Math.sin(a)*m+'px';const u=d<8?0:Math.min(1,d/40);set(Math.cos(a)*u,Math.sin(a)*u,d>=42)};
 const end=e=>{if(e.pointerId==id){id=null;set(0,0,false);kn.style.left='37px';kn.style.top='37px'}};
 joy.addEventListener('pointerdown',e=>{id=e.pointerId;joy.setPointerCapture(id);mv(e)});
 joy.addEventListener('pointermove',e=>{if(e.pointerId==id)mv(e)});joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);return()=>id}
